name: Update Necesitamos Data

on:
  # Run daily at 7:15am UTC (9:15am Madrid time).
  # Offset from the eventos/extraescolares workflows (both at 7:00) so the three
  # jobs don't race each other pushing to the same branch.
  schedule:
    - cron: '15 7 * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch data from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/fetch-necesitamos.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/necesitamos.json
          git diff --staged --quiet || (git commit -m "chore: update necesitamos data from Airtable" && git push)
