name: Capture WhatsApp intake

# Reads direct messages sent to the AFA WhatsApp number from the green-api
# queue and creates draft rows in the Airtable events table for human review.
#
# Requires green-api "pull" mode: the instance's webhook URL must be EMPTY and
# incoming-message notifications must be ON. Message SENDING is unaffected.
#
# Messages wait in the green-api queue for 24 hours, so a missed or skipped run
# loses nothing — the next run picks them up.

on:
  schedule:
    # Hourly at :23 past, 05:00–21:00 UTC (roughly 07:00–23:00 Madrid).
    #
    # NOT on the hour. GitHub's scheduler is best-effort and minute zero is its
    # most contended minute, which is documented as a high-load period. Running
    # on the hour produced only about a quarter of the expected slots, every one
    # of them 8-68 minutes late. An off-peak minute gets a better hit rate.
    #
    # The script also ignores messages less than 5 minutes old, so a text and
    # the photo or voice note that follows it are picked up together.
    - cron: '23 5-21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read the queue and report, without writing, replying or deleting'
        required: false
        default: false
        type: boolean

# Two runs draining the same queue at once would race over the same messages.
concurrency:
  group: capture-whatsapp-intake
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture WhatsApp messages into Airtable
        env:
          AIRTABLE_INTAKE_TOKEN: ${{ secrets.AIRTABLE_INTAKE_TOKEN }}
          AIRTABLE_EVENTOS_BASE_ID: ${{ secrets.AIRTABLE_EVENTOS_BASE_ID }}
          GREENAPI_INSTANCE_ID: ${{ secrets.GREENAPI_INSTANCE_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          WHATSAPP_ALLOWLIST: ${{ secrets.WHATSAPP_ALLOWLIST }}
          # Voice-note transcription. Cloudflare is tried first: it does not use
          # your audio to train models. Gemini is an optional fallback, but its
          # free tier DOES use the audio to improve Google products.
          # With neither configured, voice notes still arrive — the audio is
          # attached to the row and flagged for someone to listen to.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WHISPER_MODEL: ${{ secrets.CLOUDFLARE_WHISPER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional override, for when Google retires the default model name.
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/capture-whatsapp-intake.js
