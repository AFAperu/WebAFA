name: Send Events to Social Media

on:
  # Run daily at 8:00 UTC (10:00 Madrid summer time)
  schedule:
    - cron: '0 8 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  send-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send today's events to WhatsApp
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_EVENTOS_BASE_ID: ${{ secrets.AIRTABLE_EVENTOS_BASE_ID }}
          GREENAPI_INSTANCE_ID: ${{ secrets.GREENAPI_INSTANCE_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_GROUP_ID: ${{ secrets.GREENAPI_GROUP_ID }}
        run: node scripts/send-whatsapp-eventos.js

  send-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post today's events to Instagram
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_EVENTOS_BASE_ID: ${{ secrets.AIRTABLE_EVENTOS_BASE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: node scripts/send-instagram-eventos.js

  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install nodemailer

      - name: Send today's events by email
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_EVENTOS_BASE_ID: ${{ secrets.AIRTABLE_EVENTOS_BASE_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/send-email-eventos.js
