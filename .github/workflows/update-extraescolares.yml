name: Update Extraescolares Data

on:
  # Run daily at 7am UTC (9am Madrid time)
  schedule:
    - cron: '0 7 * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch data from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/fetch-airtable.js

      - name: Verify images downloaded
        run: |
          echo "Images in extraescolares folder:"
          ls -la images/photos/extraescolares/ 2>/dev/null || echo "No images directory found!"
          echo "Total files: $(find images/photos/extraescolares -type f ! -name '.*' 2>/dev/null | wc -l)"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/extraescolares.json images/photos/extraescolares/
          git diff --staged --quiet || (git commit -m "chore: update extraescolares data from Airtable" && git push)
